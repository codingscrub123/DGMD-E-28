<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        /* ===== UNIVERSAL STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ===== BODY STYLES ===== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Root container for React application */
        #root {
            width: 100%;
            height: 100%;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 90%;
        }

        /* Page title styling */
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        /* ===== NAVIGATION STYLES ===== */
        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== BUTTON STYLES ===== */
        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* Hover effect - buttons lift up slightly and show shadow */
        button:hover {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        /* Disabled button state - grayed out and cursor not-allowed */
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Secondary button style (for danger actions like reset) */
        button.secondary {
            background-color: #666;
        }

        button.secondary:hover {
            background-color: #444;
        }

        /* ===== GAME PAGE STYLES ===== */
        .game-content {
            margin-top: 20px;
        }

        /* Game status display box */
        .game-stats {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }

        .game-stats p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }

        /* Input field and button container */
        .input-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        /* Number input field styling */
        input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        /* Input focus state - highlights with primary color */
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        /* Disabled input state - grayed out during game over */
        input[type="number"]:disabled {
            background-color: #f5f5f5;
            color: #999;
        }

        /* ===== MESSAGE FEEDBACK STYLES ===== */
        .message {
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
        }

        /* Info message - neutral blue color */
        .message.info {
            background-color: #e3f2fd;
            color: #1976d2;
        }

        /* Success message - green color for wins */
        .message.success {
            background-color: #e8f5e9;
            color: #388e3c;
        }

        /* Error message - red color for losses and validation errors */
        .message.error {
            background-color: #ffebee;
            color: #c62828;
        }

        /* ===== SETTINGS PAGE STYLES ===== */
        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Individual form field container */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Form label styling */
        .form-group label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        /* Settings input fields */
        .form-group input {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* ===== STATS PAGE STYLES ===== */
        .stats-display {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Individual stat item container */
        .stat-item {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
        }

        /* Stat label (descriptive text) */
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }

        /* Stat value (the number) - large and bold */
        .stat-value {
            color: #333;
            font-size: 28px;
            font-weight: bold;
        }

        /* Reset button styling - red danger color */
        .reset-button {
            background-color: #f44336;
            margin-top: 20px;
        }

        .reset-button:hover {
            background-color: #d32f2f;
        }

        /* ===== GUESSES LIST STYLES ===== */
        .guesses-list {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .guesses-list p {
            margin: 5px 0;
            color: #666;
            font-size: 14px;
        }
    </style>
  <script type="module" crossorigin src="/assets/index-BnO4XSLH.js"></script>
</head>
<body>
    <!-- React root element where MyApp component will be mounted -->
    <div id="root"></div>
    
    <!-- Import main.jsx as ES module entry point -->
</body>
</html>
