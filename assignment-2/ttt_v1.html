<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet.css">
    <title>Tic Tac Toe</title>
</head>
<body>
    <div class="board" aria-label="Tic Tac Toe Board">
        <h1>Tic Tac Toe Game</h1>
        <h2>X's Turn</h2>
        <div class="container">
            <div class="square">
                <p class="mark">X</p>
            </div>
            <div class="square"></div>
            <div class="square"></div>
        </div>

        <div class="container">
            <div class="square">
                <p class="mark">O</p>
            </div>
            <div class="square"></div>
            <div class="square"></div>
        </div>

        <div class="container">
            <div class="square"></div>
            <div class="square">
                <p class="mark">X</p>
            </div>
            <div class="square"></div>
        </div>
    <button id="start-game">Start Game</button>
    <h3><a href="https://en.wikipedia.org/wiki/Tic-tac-toe" target="_blank">More Info on Tic Tac Toe</a></h3>
    </div>
</body>
</html>
